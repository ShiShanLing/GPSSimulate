<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPSSimulate</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      color: #111827;
    }
    .container {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; }
    p { line-height: 1.6; }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 8px;
    }
    a.btn {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      display: inline-block;
    }
    .btn.primary {
      background: #2563eb;
      color: #fff;
    }
    .btn.secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .muted {
      color: #6b7280;
      font-size: 14px;
      margin-top: 10px;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>GPSSimulate</h1>
      <p>Android 虚拟定位 App。通过地图选点或快捷定位，将手机 GPS 坐标模拟到指定位置。</p>
      <div class="actions">
        <a class="btn primary" href="https://github.com/ShiShanLing/GPSSimulate/releases/latest">下载最新 APK</a>
        <a class="btn secondary" href="https://github.com/ShiShanLing/GPSSimulate">查看源码</a>
      </div>
      <p class="muted">提示：请先在开发者选项中将 <code>GPSSimulate</code> 设为“模拟位置信息应用”。</p>
    </section>
  </main>
</body>
</html>
